name: Prepare
description: Rust, just, and the libraries roomy builds and tests against

inputs:
  rust:
    description: Rust toolchain
    default: stable

runs:
  using: composite
  steps:
    - name: Libraries
      shell: bash
      # python3-gi runs the display crate's stand-in for QEMU.
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev pkg-config python3-gi gir1.2-glib-2.0
    - name: Rust ${{ inputs.rust }}
      shell: bash
      run: |
        rustup toolchain install "${{ inputs.rust }}" --profile minimal --component rustfmt,clippy
        rustup default "${{ inputs.rust }}"
    - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
      with:
        tool: just
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: rust-${{ inputs.rust }}
