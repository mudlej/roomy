# roomy lab box: an Arch environment with everything needed to run the
# experiments in this directory and, later, to build and test roomy itself.
#
#   distrobox assemble create --file lab/distrobox.ini
#   distrobox enter roomy-lab
#   ./lab/run.sh            (from the roomy project directory)
#
# The box shares your home directory and /dev (including /dev/kvm and the GPU).

[roomy-lab]
image=docker.io/library/archlinux:latest
pull=true
init=false
start_now=true

# Uses the host's NVIDIA driver inside the box when there is one. Does nothing
# on AMD/Intel; delete this line if box creation complains about it.
nvidia=true

# If the roomy project is NOT under your home directory, mount it explicitly:
# volume="/path/to/roomy:/path/to/roomy"

# Virtualization stack under test
additional_packages="qemu-desktop qemu-img virtiofsd edk2-ovmf swtpm passt"
# Experiment harness (Python, D-Bus client, guest access, seed image)
additional_packages="python python-gobject dbus openssh libisoburn curl socat pciutils util-linux"
# Host GPU userspace and diagnostics
additional_packages="mesa mesa-utils vulkan-tools vulkan-radeon vulkan-intel pipewire"
# Build and UI test environment for roomy itself
additional_packages="base-devel git rust pkgconf gtk4 libadwaita libpulse weston wl-clipboard"
