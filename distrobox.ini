# The box roomy is built and tried in: Arch with QEMU, the window toolkit and the
# Rust toolchain. Create and enter it once, then use `just` (see `just --list`):
#
#   distrobox assemble create --file distrobox.ini
#   distrobox enter roomy-lab
#   ./first_time_setup.sh
#
# The box shares your home directory and /dev (including /dev/kvm and the GPU).

[roomy-lab]
image=docker.io/library/archlinux:latest
pull=true
init=false
start_now=true

# Uses the host's NVIDIA driver inside the box when there is one. Does nothing
# on AMD/Intel; delete this line if box creation complains about it.
nvidia=true

# If the roomy project is NOT under your home directory, mount it explicitly:
# volume="/path/to/roomy:/path/to/roomy"

# Virtualization stack under test
additional_packages="qemu-desktop qemu-img virtiofsd edk2-ovmf swtpm passt"
# Experiment harness (Python, D-Bus client, guest access, seed image)
additional_packages="python python-gobject dbus openssh libisoburn curl socat pciutils util-linux"
# Host GPU userspace and diagnostics
additional_packages="mesa mesa-utils vulkan-tools vulkan-radeon vulkan-intel pipewire"
# Build and UI test environment for roomy itself
additional_packages="base-devel git just rust pkgconf gtk4 libadwaita libpulse weston wl-clipboard"
# For the single-file release (just appimage): the helper it mounts itself with, and objdump
additional_packages="fuse3 binutils"


# ---------------------------------------------------------------------------
# Boxes of other distributions, for trying the single-file release there
# (`just lab-distro` inside each). They deliberately start WITHOUT what roomy
# needs: installing it is roomy's own job (`roomy setup`), and that is what
# gets tested. Only what the lab harness itself uses is put in.
#
#   distrobox assemble create --file distrobox.ini --name roomy-fedora
#   distrobox enter roomy-fedora -- just lab-distro
#
# Build the file first, in the Arch box: `just appimage`.

[roomy-fedora]
image=registry.fedoraproject.org/fedora-toolbox:45
pull=true
init=false
start_now=true
additional_packages="just python3 openssh-clients xorriso procps-ng fuse3 curl"

# Debian 13 with its backports source enabled: Debian's own QEMU is too old,
# so this is where roomy has to take QEMU alone from backports.
[roomy-debian]
image=docker.io/library/debian:trixie-backports
pull=true
init=false
start_now=true
additional_packages="just python3 openssh-client xorriso procps fuse3 curl"

[roomy-ubuntu]
image=docker.io/library/ubuntu:26.04
pull=true
init=false
start_now=true
additional_packages="just python3 openssh-client xorriso procps fuse3 curl"

[roomy-opensuse]
image=registry.opensuse.org/opensuse/tumbleweed:latest
pull=true
init=false
start_now=true
additional_packages="just python3 openssh-clients xorriso procps fuse3 curl"
